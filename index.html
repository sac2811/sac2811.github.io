<!-- JavaScript Template Loader -->


<script>


document.addEventListener(
"DOMContentLoaded",
()=>{


const templates =
document.querySelectorAll(
"[data-template]"
);



templates.forEach(
async(element)=>{


const file =
element.getAttribute(
"data-template"
);



try{


const response =
await fetch(file);



if(response.ok){


element.innerHTML =
await response.text();


}
else{


element.innerHTML =
"<p>Template not found</p>";


}


}
catch(error){


console.error(
"Template loading error:",
file,
error
);


}



});


});



</script>
